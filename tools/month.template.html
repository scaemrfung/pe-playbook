<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..700&family=Newsreader:opsz,wght@6..72,500;6..72,560;6..72,650&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="palette.css" />
</head>
<body data-page="month">
  <header class="site">
    <div class="wrap row">
      <a class="brand" href="index.html">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 4v16M4 12h16M6.6 7.2c3 2.2 7.8 2.2 10.8 0M6.6 16.8c3-2.2 7.8-2.2 10.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-text">SCA PE Playbook<span>Alberta PEW · Grades 1–6 · 4 × 30 min</span></span>
      </a>
      <form class="site-search" action="games.html" method="get" role="search">
        <label class="sr-only" for="site-q">Search games</label>
        <input id="site-q" name="q" type="search" placeholder="Search games…" autocomplete="off" />
        <button type="submit" aria-label="Search games">Search</button>
      </form>
      <nav></nav>
    </div>
  </header>
  <main class="wrap" style="padding: 24px 0 40px">
    {{CONTENT}}
  </main>
  <footer class="site">
    <div class="wrap foot">
      <p class="foot-brand">SCA PE Playbook</p>
      <p>Grades 1–6 · four 30-minute classes a week · Alberta Physical Education and Wellness. Real sport balls, stay-in dodgeball, no elimination, floor-only gymnastics. Follow your school’s safety rules.</p>
    </div>
  </footer>
  {{SCRIPTS}}
</body>
</html>
